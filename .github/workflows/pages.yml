name: Deploy showcase to GitHub Pages

# Builds the static rendition of the twelve use cases and publishes it.
# The static build runs every module in the browser against the local engine
# (there is no server on Pages, so there is nothing to call an API).

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build static site
        env:
          VITE_STATIC: "1"
        run: npx vite build --base="/${{ github.event.repository.name }}/"

      - name: Add Pages conveniences
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
          du -sh dist

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Enables Pages (source: GitHub Actions) on the first run if the repo
          # has not turned it on yet. Requires the pages:write permission above.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
